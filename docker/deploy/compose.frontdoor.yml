# Optional :443 front-door overlay (#60). The base self-host stack
# (compose.selfhost.yml) runs the mesh-plane relay on :4433 only — it deliberately
# publishes NO :443. This overlay wires the edge's unified :443 front door (#31
# FD1-FD4a): one published :443 that SNI/ALPN-demuxes to the tunnel data-plane
# relay, the Portal landing page (terminated with a BYO cert, reverse-proxied to
# the control plane), and Browser-Plane subdomains (SNI passthrough, e.g.
# help.<zone>). It also enables host-ownership authorization so only
# control-plane-authorized hostnames may bind. Add compose.sso.yml on top for the
# Keycloak Auth route (#48).
#
# OFF BY DEFAULT: opt in by naming it explicitly.
#
#   docker compose \
#     -f docker/deploy/compose.selfhost.yml \
#     -f docker/deploy/compose.frontdoor.yml \
#     [-f docker/deploy/compose.sso.yml] \
#     --env-file docker/deploy/.env up --build -d
#
# .env keys this overlay reads (see docs/ops/runbook.md):
#   PORTAL_PUBLIC_HOST   the Portal/landing hostname (e.g. bunsenbrenner.org), its
#                        DNS pointed at this edge. Served + terminated at :443.
#   PORTAL_CERT_DIR      host dir with the Portal BYO cert: fullchain.pem + privkey.pem
#                        (LE via deSEC DNS-01, like help.'s origin cert). Never committed.
#   WILDCARD_CERT_DIR    host dir with the shared *.{PORTAL_PUBLIC_HOST} wildcard cert
#                        (#233 Rot/Gelb/Grün admission broker's Gelb tier — see
#                        scripts/issue-wildcard-cert.sh). Backs ONLY hostnames the
#                        control plane has explicitly marked Gelb; every other
#                        BrowserTunnel host is completely unaffected (still ordinary
#                        SNI passthrough) even when this is configured.
#   CT_EDGE_ADMIN_TOKEN  64-hex shared secret enabling host-auth + revoke admin ops;
#                        the control plane uses the same value to authorize hostnames.

name: ct-selfhost

services:
  edge:
    # Without env_file the front-door vars below can't be overridden from .env.
    env_file:
      - .env
    environment:
      # Unified front door: ALPN=ct-edge -> relay; Portal SNI -> terminate+proxy
      # to the control plane; other SNI -> Browser-Plane passthrough. Binds
      # 8443 (unprivileged) INSIDE the container, not 443 -- #305: the edge now
      # runs as non-root (uid 65532), which can't bind a port <1024 without
      # CAP_NET_BIND_SERVICE. Docker's own port-publish mapping below
      # ("443:8443") does the host:443 -> container:8443 translation at the
      # network layer, so externally this is unchanged: clients still connect
      # to :443, same TLS/ALPN behavior, same cert. Nothing outside this
      # container's own listen address needed to change.
      CT_FRONT_DOOR: "0.0.0.0:8443"
      # #66/#305: same port-remap reasoning as CT_FRONT_DOOR above -- 8080
      # internally, published as the host's :80 via the port mapping below.
      # Redirect only — no cert, no TLS terminated here.
      CT_EDGE_HTTP_REDIRECT: "0.0.0.0:8080"
      CT_EDGE_PORTAL_HOST: "${PORTAL_PUBLIC_HOST:?set PORTAL_PUBLIC_HOST=<zone>}"
      CT_CP_PROXY_ADDR: "control-plane:8090"
      CT_EDGE_PORTAL_CERT: "/certs/portal/fullchain.pem"
      CT_EDGE_PORTAL_KEY: "/certs/portal/privkey.pem"
      # #233: the shared Gelb-tier wildcard cert. Absent/unusable simply means
      # no hostname can ever be Gelb-terminated (falls through to ordinary
      # passthrough) -- never a startup failure, matching every other
      # front-door cert here (#142).
      CT_EDGE_WILDCARD_CERT: "/certs/wildcard/fullchain.pem"
      CT_EDGE_WILDCARD_KEY: "/certs/wildcard/privkey.pem"
      # Host-ownership authorization (#23 BP4b): only control-plane-authorized
      # hostnames may bind — required for the help.<zone> Browser-Plane demo and the
      # revoke push. The control plane authorizes via the admin API below.
      CT_EDGE_ADMIN_TOKEN: "${CT_EDGE_ADMIN_TOKEN:?set CT_EDGE_ADMIN_TOKEN=<64-hex, same on control-plane>}"
      CT_EDGE_REQUIRE_HOST_AUTH: "1"
      CT_EDGE_ADMIN_LISTEN: "0.0.0.0:9601"
    volumes:
      - "${PORTAL_CERT_DIR:?set PORTAL_CERT_DIR=<dir with portal fullchain.pem+privkey.pem>}:/certs/portal:ro"
      - "${WILDCARD_CERT_DIR:?set WILDCARD_CERT_DIR=<dir with wildcard fullchain.pem+privkey.pem>}:/certs/wildcard:ro"
    ports:
      # #305: host:443/80 -> container:8443/8080 -- see CT_FRONT_DOOR's comment
      # above. The container-side ports changed; the host-published, externally-
      # visible ones (443/80) deliberately have not.
      #
      # #248 TRAP for downstream integrators: this "443:8443" mapping is a
      # HOST-level Docker port-publish. It only translates traffic entering
      # from OUTSIDE Docker (the real internet, or the host's own loopback) --
      # it does NOT create a listener reachable at <this-container's-ip>:443
      # for another container on the SAME compose network. A sibling service
      # (an agent, a bridge, anything reaching the edge's front door from
      # inside Docker) MUST connect to :8443 directly, not :443, or it gets an
      # instant OS-level "Connection refused" with no indication why. Bit
      # CADS-a2a-demo for real: its bridge's relay-gate DCUtR dial used
      # "edge:443" and failed 100% of the time until fixed to "edge:8443" --
      # see that repo's run-demo.sh for the full incident writeup. Only
      # affects a container-internal client of CT_CHANNEL_FRONT_DOOR /
      # CT_CHANNEL_RELAY_GATE specifically; every other agent in this
      # ecosystem talks to the edge on :4433 (a real bound port, no host-only
      # publish, unaffected).
      - "443:8443"
      - "80:8080"
      # Edge admin API (host-ownership authorize/revoke, #23 BP4b) — unauthenticated
      # by network but token-gated (x-ct-admin-token); loopback-only like the
      # metrics port above, so an operator script on this host (e.g.
      # examples/help-site/run-demo.sh's CT_CP_EDGE_ADMIN_URL) can reach it without
      # publishing it publicly. The control plane itself reaches it internally via
      # http://edge:9601, unaffected by this host-side publish.
      - "127.0.0.1:${EDGE_ADMIN_PORT:-9601}:9601"

  control-plane:
    # Let the control plane authorize hostnames + push revocations to the edge's
    # admin API (#23 BP4b-c, #27 RB4b) — same token as the edge.
    environment:
      CT_CP_EDGE_ADMIN_URL: "http://edge:9601"
      CT_CP_EDGE_ADMIN_TOKEN: "${CT_EDGE_ADMIN_TOKEN:?set CT_EDGE_ADMIN_TOKEN=<64-hex, same on edge>}"
      # #68: the customer-facing install one-liner embeds this public base URL.
      # Reuse the front door's Portal host (no separate .env key) — without it the
      # one-liner defaults to https://localhost and is useless for a real customer.
      CT_PORTAL_BASE_URL: "https://${PORTAL_PUBLIC_HOST:?set PORTAL_PUBLIC_HOST=<zone>}"
