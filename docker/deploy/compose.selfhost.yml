# Self-host deployment bundle (M21.1b): the operator runs the hosted control
# plane + one edge as long-running, restart-on-failure services with durable
# state and health checks. Customers run their own agents (outbound-only) and
# distribute the CA root (docs/deploy) to their clients.
#
#   cp docker/deploy/.env.example docker/deploy/.env   # then edit secrets
#   docker compose -f docker/deploy/compose.selfhost.yml --env-file docker/deploy/.env up --build -d
#
# The control plane persists to a named volume, so restarts and upgrades keep
# enrollment, the tunnel registry and the credit ledger intact.

name: ct-selfhost

services:
  control-plane:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
      # #315: the slim self-host runtime -- no iproute2/iptables in the image at
      # all (unlike the default `runtime` target, which every testbed/netem
      # compose file still needs and keeps getting unchanged). edge below shares
      # this same built image/tag, so it gets the slim target too without its own
      # build block.
      target: production
    image: ct-testbed
    command: ["ct-control-plane"]
    # #305: run as non-root (matches the image's own USER 65532:65532 default,
    # docker/Dockerfile) -- explicit here too so a future base-image change can't
    # silently widen this back to root. /data and /shared must be owned by (or
    # group-writable for) this uid -- see the operator migration note in #305's
    # closing comment for existing deployments upgrading from a root-owned volume.
    user: "65532:65532"
    # #312: bounded, so a runaway/leaking co-located service (edge under PoW/relay
    # load, Keycloak) can't OOM-kill this one on a shared single-host deploy -- this
    # host runs with NO swap, so an unbounded container is one bad spike away from
    # taking the whole stack down together. `mem_limit`/`cpus` (legacy top-level
    # keys), NOT `deploy.resources.limits` -- the latter is silently a no-op under
    # plain `docker compose up` (Swarm-only), which would make this fix a no-op too.
    # Sized generously above this thin service's real footprint (~10MB idle) rather
    # than tightly, so normal load never trips it.
    mem_limit: 512m
    mem_reservation: 128m
    cpus: 1.0
    environment:
      CT_CONTROL_PLANE_LISTEN: "0.0.0.0:8090"
      # #214: without this, the portal-session HMAC key falls back to a fresh
      # random one on EVERY restart (main.rs's own documented behavior) --
      # not just this repo's own portal sessions, but the Browser-Plane login
      # gate's ct_gate_session cookies too (gate.rs shares the same key).
      # Every redeploy silently logs everyone out and drops every gated
      # tunnel's active sessions. Optional (a base-only deployment with no
      # SSO configured never mints a session to begin with, so an unset
      # value there is harmless) -- but any deployment that DOES run
      # compose.sso.yml should set a real one in .env: 64 random hex chars,
      # e.g. `openssl rand -hex 32`.
      CT_PORTAL_SESSION_KEY: "${CT_PORTAL_SESSION_KEY:-}"
      CT_CONTROL_PLANE_DB: "/data/control-plane.db"
      # Where the control plane reads the edge CA root to publish at /pki/ca
      # (#11). The edge writes it into the shared volume (CT_EDGE_CERT_OUT below);
      # the control plane mounts that volume read-only and serves the DER. Without
      # the mount, /shared/edge-cert.der is absent and /pki/ca returns 503 (#16).
      CT_CP_EDGE_CERT_PATH: "/shared/edge-cert.der"
      # Live tunnel count for /status & the operator page (#17): the live
      # registry is the edge's, so scrape its /metrics (ct_edge_active_tunnels)
      # over the internal network. Falls back to the CP registry if unreachable.
      CT_CP_EDGE_METRICS_URL: "http://edge:9600/metrics"
      # OIDC / Keycloak (verified for /me/* endpoints); set in .env.
      CT_OIDC_ISSUER: "${CT_OIDC_ISSUER:-}"
      # #81 SEC81c-c-i / #100 / #103: the edge-facing channel-authorize endpoint
      # (POST /internal/channel/authorize) mounts only when this shared admin token is
      # set. It is the SAME 64-hex CT_EDGE_ADMIN_TOKEN the edge holds — so setting that
      # one secret (already required for the front door / tunnel revoke) also turns on
      # the Agent-Fabric channel broker end-to-end, with no extra step.
      CT_CP_EDGE_ADMIN_TOKEN: "${CT_EDGE_ADMIN_TOKEN:-}"
      # #214 follow-up (generic pipeline provisioning): GET /network-info reports these so a
      # generic ct-agent never hardcodes/guesses which port serves which purpose (the 4433-vs-
      # 4435/4436 mesh-edge-vs-channel-broker mixup). SAME shell vars the edge block below reads,
      # so the two can never drift out of sync from a single .env source of truth.
      CT_CP_MESH_EDGE_PORT: "${EDGE_PORT:-4433}"
      CT_CP_CHANNEL_BROKER_PORT: "${EDGE_CHANNEL_PORT:-4435}"
      CT_CP_CHANNEL_RELAY_PORT: "${EDGE_CHANNEL_RELAY_PORT:-4436}"
      # #38 DL2: the edge's public IP, so the portal's tunnel-hostname DNS
      # autopilot (crates/control-plane/src/portal_api.rs DnsAutopilot) can
      # auto-create the A record for a Standard-tier tunnel's auto-assigned
      # hostname. Not a secret (it's the same IP bunsenbrenner.org's own DNS
      # already publishes) -- defaulted here rather than requiring a .env
      # entry, since without it st.dns stays None and NO tunnel ever gets an
      # auto-assigned hostname at all (silently -- this was the actual cause
      # of the very first real account's tunnel showing a bare "site" name
      # with no hostname).
      CT_CP_DNS_EDGE_IP: "${CT_CP_DNS_EDGE_IP:-57.131.133.91}"
    env_file:
      - .env
    volumes:
      - cpdata:/data
      - shared:/shared:ro
    ports:
      # #85: bind the control plane's plain-HTTP :8090 to LOOPBACK only. It carries
      # OIDC bearer tokens + portal session cookies in cleartext, so it must never be
      # published on a public interface (docs/security/tls-everywhere.md). Public
      # access goes through the :443 front door (compose.frontdoor.yml), which
      # terminates TLS and reverse-proxies over the internal docker network; a local
      # reverse proxy / debugging still reaches 127.0.0.1:8090.
      - "127.0.0.1:${CONTROL_PLANE_PORT:-8090}:8090"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8090/readyz"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 5s

  edge:
    image: ct-testbed
    command: ["ct-edge"]
    # 2026-08-15 outage (15 min, :443 fully down): the daemon's DEFAULT soft
    # nofile limit of 1024 is far below what the edge terminates under a real
    # reconnect herd -- every accepted socket is an fd, and once EMFILE hit,
    # the accept loops hot-spun and the herd self-sustained (every starved
    # client retried). The edge is the single public termination point for
    # every tunnel, channel and portal connection on this host; give it the
    # hard limit outright.
    ulimits:
      nofile:
        soft: 262144
        hard: 524288
    # #305: see control-plane's own comment above. /shared must be owned by (or
    # group-writable for) this uid, including the CA signing key file it writes
    # there on first boot (edge-ca-key.pem, 0600) -- the file permissions
    # themselves (owner-only) are unaffected by which non-root uid owns them.
    user: "65532:65532"
    # #312: same rationale as control-plane's own limit above -- edge is the one
    # most likely to actually spike (PoW #202 solving under a flood, relay traffic),
    # so this is both the most important service to bound AND the one that most
    # needs its own headroom to not spuriously trip under legitimate load.
    mem_limit: 512m
    mem_reservation: 128m
    cpus: 1.5
    environment:
      CT_EDGE_LISTEN: "0.0.0.0:4433"
      CT_EDGE_POW_DIFFICULTY: "${EDGE_POW_DIFFICULTY:-16}"
      CT_EDGE_CERT_OUT: "/shared/edge-cert.der"
      # Expose live gauges (ct_edge_active_tunnels/-agents + relay counters, #10).
      # The control plane scrapes this internally for /status (#17); it is also
      # published to the host loopback below so operators can scrape it locally (#19).
      CT_EDGE_METRICS_LISTEN: "0.0.0.0:9600"
      # #81 SEC81c-c / #100 / #103: the Agent-Fabric channel broker. It binds a
      # rendezvous QUIC endpoint and authorizes channel joins against the control plane.
      # run_edge activates it ONLY when all three of these are set-and-non-empty (else it
      # is gracefully absent), so it turns on automatically the moment the operator has
      # CT_EDGE_ADMIN_TOKEN configured (which the front door / tunnel-revoke already
      # require) — no separate deploy step. This is the plane-side of the A2A channel
      # tunnel (source <-> sink, #98/#99/#103).
      CT_EDGE_CP_URL: "http://control-plane:8090"
      CT_EDGE_ADMIN_TOKEN: "${CT_EDGE_ADMIN_TOKEN:-}"
      # The rendezvous/relay bind ports were previously hardcoded here while the port
      # PUBLISH mapping below already read EDGE_CHANNEL_PORT/EDGE_CHANNEL_RELAY_PORT from
      # .env — i.e. only the published (host-side) port was ever actually configurable,
      # the container's own listen address wasn't, so the two could silently drift.
      # Reusing the SAME .env vars for both sides makes this a genuine single parameter:
      # an operator whose network/DDoS-protection blocks the default UDP ports (observed
      # on host-unlimited.de's Voxility protection, #141) can move both rendezvous + relay
      # to any confirmed-open port pair via .env alone, no compose/code edit needed.
      CT_EDGE_CHANNEL_LISTEN: "0.0.0.0:${EDGE_CHANNEL_PORT:-4435}"
      CT_EDGE_CHANNEL_RELAY_LISTEN: "0.0.0.0:${EDGE_CHANNEL_RELAY_PORT:-4436}"
      # Video-conferencing feature: the browser-reachable Agent-Fabric channel entry
      # point (ws_channel.rs) -- a browser has no raw UDP/QUIC or TLS-ALPN control of
      # its own, so it can't reach either broker above; this is a plain WebSocket
      # listener bridging into the identical admission/pairing/relay core (now
      # cross-transport-paired with the two brokers above via SharedChannelPairer).
      # Same opt-in convention (activates only when CP_URL + ADMIN_TOKEN are also
      # set, which this deployment already has). Plain ws:// here -- a TLS-
      # terminating front (Caddy or the edge's own TLS) in front of it, for a real
      # browser page to reach it as wss://, is a separate follow-up.
      CT_EDGE_WS_CHANNEL_LISTEN: "0.0.0.0:${EDGE_WS_CHANNEL_PORT:-4437}"
      # #546 endpoint attestation. Refuses a channel join that was OBSERVED on a global
      # address while advertising a different one of the same family -- and only that.
      # Members seen on a private address (`unobservable`) and relay-only members that
      # advertise no address at all (`no_address`) are never refused: equality is
      # structurally impossible for them, so there is nothing to corroborate.
      # Unset here on purpose -- the shipped default stays OFF for every deployment, and
      # an operator arms it in their own `.env` once their own field counters show
      # `mismatch` at zero. See docs/ops/runbook.md before setting it.
      CT_EDGE_REQUIRE_ATTESTED_ENDPOINT: "${CT_EDGE_REQUIRE_ATTESTED_ENDPOINT:-}"
      # #506: park TTL for keepalive-negotiated legs. Unset keeps the edge's own 30s default.
      # The knob existed in the edge and was documented in the runbook, but no compose file
      # forwarded it -- setting it in the deploy environment therefore did nothing at all,
      # silently. Found by reading the value back out of the running container instead of
      # trusting the deploy (`docker exec ... echo $CT_EDGE_KA_PARK_TTL_SECS` came back empty).
      CT_EDGE_KA_PARK_TTL_SECS: "${CT_EDGE_KA_PARK_TTL_SECS:-}"
    volumes:
      - shared:/shared
    ports:
      - "${EDGE_PORT:-4433}:4433/udp"
      - "${EDGE_PORT:-4433}:4433/tcp"
      # Agent-Fabric channel RENDEZVOUS (#100/#103) — pairs two members for a direct dial.
      - "${EDGE_CHANNEL_PORT:-4435}:${EDGE_CHANNEL_PORT:-4435}/udp"
      - "${EDGE_CHANNEL_PORT:-4435}:${EDGE_CHANNEL_PORT:-4435}/tcp"
      # Agent-Fabric channel RELAY (#105): the fallback both NAT'd members tunnel through
      # (rendezvous alone can't pair peers that can't reach each other directly). Defaults
      # to rendezvous port + 1; set EDGE_CHANNEL_RELAY_PORT explicitly in .env to pick an
      # independently-confirmed-open port instead of relying on an untested "+1" neighbor.
      # Restrictive client networks that block these ports fall back to the :443 front
      # door (#106, ALPN=ct-edge-channel).
      - "${EDGE_CHANNEL_RELAY_PORT:-4436}:${EDGE_CHANNEL_RELAY_PORT:-4436}/udp"
      - "${EDGE_CHANNEL_RELAY_PORT:-4436}:${EDGE_CHANNEL_RELAY_PORT:-4436}/tcp"
      # Video-conferencing feature: the browser-reachable WebSocket channel listener
      # (ws_channel.rs, admission-gated same as the ports above -- a signed grant +
      # possession proof is required, so this is safe to publish on all interfaces).
      - "${EDGE_WS_CHANNEL_PORT:-4437}:${EDGE_WS_CHANNEL_PORT:-4437}/tcp"
      # Operator-facing metrics scrape endpoint (#19), bound to LOOPBACK (#85) — it's
      # unauthenticated, so it must not be published on a public interface; scrape it
      # from 127.0.0.1 (or internally via the docker network at edge:9600). Override
      # the host port with EDGE_METRICS_PORT in .env; defaults to 9600.
      - "127.0.0.1:${EDGE_METRICS_PORT:-9600}:9600"
    restart: unless-stopped
    # #377: unlike control-plane, edge had no healthcheck at all -- restart:
    # unless-stopped only recovers a crashed container, not one whose process is
    # still running but hung (listener bound, CA-minting stuck, etc.), and with no
    # health status a future dependent service (a front-door/Keycloak overlay that
    # needs edge up first) has no `condition: service_healthy` to wait on the way
    # edge itself already waits on control-plane below. Reuses the same tool
    # (curl, already proven available in this image by control-plane's own
    # healthcheck) against edge's real, already-relied-upon /metrics HTTP endpoint
    # (control-plane's own CT_CP_EDGE_METRICS_URL scrapes this exact same URL for
    # /status) -- a genuine "the process is alive and serving" signal, not just a
    # bare TCP connect to the QUIC/TLS front-door port, which isn't an HTTP server
    # and wouldn't validate the same probe request the finding's own suggested
    # command sent to it.
    # #498 hardening: probe /healthz, not /metrics. /metrics only proved the metrics HTTP
    # server was alive -- a wedged channel-broker accept loop (the 2026-08-13 outage class:
    # process running, listener bound, no join ever admitted) stayed "healthy" forever.
    # /healthz gates on the #497 broker-loop heartbeats (beaten every iteration incl. 10s
    # idle ticks; stale > 60s = wedged), so "healthy" now means "can admit channel joins".
    # start_period covers the first beat landing within one idle tick of spawn.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9600/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 30s
    depends_on:
      control-plane:
        condition: service_healthy

volumes:
  cpdata:
  shared:
