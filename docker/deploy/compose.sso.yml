# Optional SSO overlay (#42): a Keycloak/OIDC identity provider for exercising the
# customer-portal flow (#25-#29) end-to-end with a REAL Authorization-Code login,
# instead of only hermetic HS256 test doubles.
#
# OFF BY DEFAULT: this is a separate overlay you opt into by naming it explicitly.
# The base self-host stack runs unchanged without it.
#
#   docker compose \
#     -f docker/deploy/compose.selfhost.yml \
#     -f docker/deploy/compose.sso.yml \
#     --env-file docker/deploy/.env up --build -d
#
# On boot Keycloak imports the declarative demo realm (keycloak/ct-demo-realm.json):
# realm `ct-demo`, confidential client `ct-portal` (RS256), self-registration on.
# The control-plane fetches the realm's RS256 signing key from its JWKS at startup
# (KC2-c), so no key export is needed. Full runbook: docs/deploy/keycloak-sso.md.
#
# #48: Keycloak is reached through the edge's unified :443 front door on its own
# hostname (AUTH_PUBLIC_HOST, e.g. auth.<zone>) — NO separate published port. The
# front door terminates TLS for auth.<zone> with a BYO cert and reverse-proxies to
# keycloak:8080 internally. This makes KEYCLOAK_PUBLIC_URL = https://auth.<zone> a
# real, externally-reachable URL, so the token `iss` and the browser login work
# from a remote browser (not just from the host running the containers).
#
# Prereq: the edge's :443 front door must be enabled — add compose.frontdoor.yml
# (#60), which wires CT_FRONT_DOOR + the Portal routing/cert. This overlay only
# adds the Auth (Keycloak) route on top:
#   -f compose.selfhost.yml -f compose.frontdoor.yml -f compose.sso.yml
#
# .env keys this overlay reads (see docs/deploy/keycloak-sso.md and .env.example):
#   AUTH_PUBLIC_HOST      the Keycloak hostname served via the front door (auth.<zone>).
#   KEYCLOAK_PUBLIC_URL    https://<AUTH_PUBLIC_HOST> — the realm issuer base
#                         (<KEYCLOAK_PUBLIC_URL>/realms/ct-demo); reachable from both
#                         the browser and the control-plane (both go via the front door).
#   AUTH_CERT_DIR         host dir with the BYO cert for auth.<zone> — fullchain.pem +
#                         privkey.pem (obtained like the Portal's, deSEC DNS-01).
#   PORTAL_PUBLIC_URL     the portal base URL the browser uses (https://<zone>).
#   KC_PORTAL_CLIENT_SECRET  the `ct-portal` confidential-client secret (#65). Pick
#                         any random hex ONCE and keep it in .env. Keycloak imports
#                         this exact value on every realm (re)import and the
#                         control-plane uses the same var for the code→token
#                         exchange, so they never drift — no more copying a
#                         Keycloak-minted secret by hand after each recreate.
#   KC_WEBCONFERENCE_BRIDGE_CLIENT_SECRET  optional: the `webconference-bridge`
#                         service-account client's secret (core request, 2026-08-04).
#                         A downstream demo's bridge process authenticates as this
#                         client (grant_type=client_credentials) to call /me/channels
#                         etc. as a real M2M credential instead of a browser-session
#                         cookie a control-plane restart can invalidate. Empty by
#                         default like the KC_GOOGLE_*/KC_GITHUB_* brokering secrets
#                         above — this client is feature-specific (one demo's bridge),
#                         not core to every self-hoster, so it stays optional; set it
#                         once and keep it in .env for the same drift-free reason as
#                         KC_PORTAL_CLIENT_SECRET.

# #307 (found live, 2026-08-01 -- this exact failure mode already hit the running
# deployment once this session: a `docker compose up` that only named other services
# ended up recreating Keycloak too because its own compose config had changed,
# silently wiping every registered account): Keycloak's data directory
# (/opt/keycloak/data, where its embedded H2 database file lives even in --import-realm
# / start-dev mode) was never on a persistent volume -- it lived in the container's
# writable layer, so ANY recreate (image update, host reboot, an unrelated compose
# change that happens to touch keycloak's own block) silently wiped every registered
# user, session, and IdP link. `keycloak_data` below fixes exactly that: the H2 file
# now survives a recreate. Keycloak's own realm-import strategy (IGNORE_EXISTING, the
# default) means `--import-realm` is a no-op once the realm already exists in the
# persisted data -- so this is safe to combine with the always-present
# ct-demo-realm.json mount: first boot imports the declarative baseline (client
# secrets, IdP config), every boot after that preserves the real accumulated user data.
#
# #307 (remaining half, done with the operator's explicit go-ahead given the blast
# radius): `start-dev` is Keycloak's own documented "not for production" mode, and
# the previous fix above only addressed data SURVIVING a recreate (H2 on a volume),
# not the underlying storage itself -- H2 is still a single-file embedded DB, not
# something Keycloak's own docs recommend for a real multi-connection production
# workload. Switched to `start` (real production mode) with `KC_DB=postgres`.
#
# Migrated the 47 real accounts that existed at cutover with Keycloak's own
# export/import tooling (`kc.sh export --realm ct-demo --users realm_file`, then
# `kc.sh import`), verified by user count matching before/after and a live login
# test -- NOT a fresh start that would have silently repeated the exact data-loss
# this issue exists to prevent, just via a different mechanism (an empty new DB
# instead of a wiped volume). The prior H2 volume (`keycloak_data`) and a
# stand-alone tarball backup are both kept, not deleted, as a real rollback path.
#
# `KC_HOSTNAME`/`KC_HTTP_ENABLED` are unchanged from before -- production mode
# still works the same way here because the edge is a raw L4/TCP proxy (no
# X-Forwarded-* rewriting either way), so nothing about the hostname/HTTPS story
# actually differs between dev and production mode for this deployment shape.
name: ct-selfhost

services:
  # #307: real production Postgres backend for Keycloak, replacing the single-file
  # embedded H2 (`start-dev`'s default, and what plain `start` would still use
  # without KC_DB set -- Keycloak's own docs call H2 unsupported for production).
  # Separate named volume from `keycloak_data` (which still holds the migrated-away
  # H2 file as a rollback artifact, not actively read once this is live).
  keycloak-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: "${KC_DB_PASSWORD:?set KC_DB_PASSWORD in .env -- Keycloak's real production Postgres backend, no default}"
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: ["start", "--import-realm"]
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    # #312: bounded like every other service on this shared, no-swap host (see
    # compose.selfhost.yml's control-plane/edge limits for the full rationale) --
    # sized well above Keycloak's real JVM baseline (~560MB observed) for GC/session
    # headroom, not tightly.
    mem_limit: 1536m
    mem_reservation: 512m
    cpus: 1.5
    environment:
      # Dev-mode bootstrap admin (override in .env for anything reachable). These
      # are Keycloak's own admin-console creds, unrelated to the portal client.
      # NOTE: KEYCLOAK_ADMIN/_PASSWORD are the correct names for the pinned :25.0
      # image — KC_BOOTSTRAP_ADMIN_* are 26+ only and are silently ignored on 25,
      # leaving no admin user at all (so you can't fetch the client secret).
      # #306: KEYCLOAK_ADMIN_PASSWORD has NO default — this overlay fronts the admin
      # console on the public auth.<zone> host, so a forgotten KC_ADMIN_PASSWORD used
      # to silently mean "admin"/"admin" reachable from the internet. Required, like
      # every other real secret in this file (see KC_PORTAL_CLIENT_SECRET below).
      KEYCLOAK_ADMIN: "${KC_ADMIN_USER:-admin}"
      KEYCLOAK_ADMIN_PASSWORD: "${KC_ADMIN_PASSWORD:?set KC_ADMIN_PASSWORD in .env -- no default, this console is public}"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
      # #307: real Postgres backend (see the header comment for why H2 was replaced)
      # -- same KC_DB_PASSWORD var the keycloak-postgres service's own
      # POSTGRES_PASSWORD reads above, so the two can't drift, matching this file's
      # existing KC_PORTAL_CLIENT_SECRET pinning convention.
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: "${KC_DB_PASSWORD:?set KC_DB_PASSWORD in .env -- Keycloak's real production Postgres backend, no default}"
      # Pin the realm issuer to the public front-door URL (https://auth.<zone>) so
      # the token's `iss` matches what the control-plane validates and what the
      # browser reached. The edge is an L4 (TCP) reverse proxy — it does not set
      # X-Forwarded-* — so KC_HOSTNAME pinned to the https URL is what makes
      # Keycloak emit https URLs; no KC_PROXY_HEADERS needed.
      KC_HOSTNAME: "${KEYCLOAK_PUBLIC_URL:?set KEYCLOAK_PUBLIC_URL=https://<AUTH_PUBLIC_HOST>}"
      # #49: identity-brokering credentials the realm import substitutes into the
      # google/github/gitlab providers via ${env.KC_*}. Empty by default — set the
      # ones you want active in .env (each needs an OAuth app on that platform).
      # See docs/deploy/keycloak-sso.md. An empty pair leaves that button present
      # but non-functional; remove/disable unwanted providers in the admin console.
      KC_GOOGLE_CLIENT_ID: "${KC_GOOGLE_CLIENT_ID:-}"
      # #65: pin the ct-portal confidential-client secret so Keycloak adopts THIS
      # fixed value on every --import-realm instead of minting a fresh random one.
      # Keycloak's realm is ephemeral (start-dev, no volume) and reimports on every
      # recreate; without a pinned secret the control-plane's CT_OIDC_CLIENT_SECRET
      # drifts out of sync and every login 502s. The realm JSON substitutes this via
      # ${env.KC_PORTAL_CLIENT_SECRET}; the control-plane below reads the SAME var.
      KC_PORTAL_CLIENT_SECRET: "${KC_PORTAL_CLIENT_SECRET:?set KC_PORTAL_CLIENT_SECRET=<random hex; stable across Keycloak reimports>}"
      # Same pinning mechanism as KC_PORTAL_CLIENT_SECRET just above, but optional
      # (empty default) -- this client only matters to whichever demo's bridge
      # actually uses it, not to every self-hoster. Substituted into the realm
      # JSON's webconference-bridge client via ${env.KC_WEBCONFERENCE_BRIDGE_CLIENT_SECRET}.
      KC_WEBCONFERENCE_BRIDGE_CLIENT_SECRET: "${KC_WEBCONFERENCE_BRIDGE_CLIENT_SECRET:-}"
      # #310: the ct-portal client's redirectUris/post.logout.redirect.uris were
      # hardcoded to bunsenbrenner.org in the committed realm JSON -- any self-hoster
      # on their own domain got an unregistered-redirect-uri 400 on every login,
      # unfixable short of hand-editing the committed realm file. The realm JSON now
      # substitutes ${PORTAL_PUBLIC_URL}, same mechanism as KC_PORTAL_CLIENT_SECRET
      # just above -- SAME var the control-plane's own CT_OIDC_REDIRECT_URI already
      # derives from below, so the two can't drift.
      PORTAL_PUBLIC_URL: "${PORTAL_PUBLIC_URL:?set PORTAL_PUBLIC_URL=https://<zone>}"
      KC_GOOGLE_CLIENT_SECRET: "${KC_GOOGLE_CLIENT_SECRET:-}"
      KC_GITHUB_CLIENT_ID: "${KC_GITHUB_CLIENT_ID:-}"
      KC_GITHUB_CLIENT_SECRET: "${KC_GITHUB_CLIENT_SECRET:-}"
      KC_GITLAB_CLIENT_ID: "${KC_GITLAB_CLIENT_ID:-}"
      KC_GITLAB_CLIENT_SECRET: "${KC_GITLAB_CLIENT_SECRET:-}"
      # Outbound mail (password reset / email verification) -- the realm JSON's
      # smtpServer block resolves these via ${VAR:default} at import time. Empty
      # KC_SMTP_PASSWORD by default (mail just won't send, same as before this
      # existed); set real values in .env to enable it. Never commit real values.
      KC_SMTP_HOST: "${KC_SMTP_HOST:-smtp.strato.de}"
      KC_SMTP_PORT: "${KC_SMTP_PORT:-465}"
      KC_SMTP_FROM: "${KC_SMTP_FROM:-no-reply@bunsenbrenner.org}"
      KC_SMTP_SSL: "${KC_SMTP_SSL:-true}"
      KC_SMTP_STARTTLS: "${KC_SMTP_STARTTLS:-false}"
      KC_SMTP_USER: "${KC_SMTP_USER:-no-reply@bunsenbrenner.org}"
      KC_SMTP_PASSWORD: "${KC_SMTP_PASSWORD:-}"
    volumes:
      # #307: persist Keycloak's own data dir (its H2 DB file lives here) across
      # recreates -- see the header comment above for why this matters.
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/ct-demo-realm.json:/opt/keycloak/data/import/ct-demo-realm.json:ro
      # Custom login theme (ct-bunsenbrenner): real Terms-and-Conditions text (EN/DE,
      # linking the live Nutzungsbedingungen/Datenschutz/Impressum pages) instead of
      # Keycloak's built-in "Terms and conditions to be defined" placeholder.
      - ./keycloak/themes/ct-bunsenbrenner:/opt/keycloak/themes/ct-bunsenbrenner:ro
    # #48: NO published port — Keycloak is reached only through the edge :443 front
    # door (auth.<zone>) and internally as keycloak:8080. Nothing to open on the host.
    expose:
      - "8080"
    restart: unless-stopped
    healthcheck:
      # Keycloak 25 serves /health on the MANAGEMENT interface (:9000), not the
      # main HTTP port (:8080, which 404s the health path). Probe :9000.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && cat <&3 | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # #48: add the Auth (Keycloak) route to the edge's :443 front door — terminate
  # TLS for auth.<zone> with a BYO cert and reverse-proxy to keycloak:8080. Assumes
  # the front door + Portal routing are already enabled on the edge (see the header).
  edge:
    environment:
      CT_EDGE_AUTH_HOST: "${AUTH_PUBLIC_HOST:?set AUTH_PUBLIC_HOST=auth.<zone>}"
      CT_EDGE_AUTH_ADDR: "keycloak:8080"
      CT_EDGE_AUTH_CERT: "/certs/auth/fullchain.pem"
      CT_EDGE_AUTH_KEY: "/certs/auth/privkey.pem"
    volumes:
      # BYO cert for auth.<zone> (fullchain.pem + privkey.pem), obtained like the
      # Portal's via deSEC DNS-01. Never committed — supplied from the host.
      - "${AUTH_CERT_DIR:?set AUTH_CERT_DIR=<host dir with auth fullchain.pem+privkey.pem>}:/certs/auth:ro"
    depends_on:
      keycloak:
        condition: service_healthy

  # Merge the OIDC env onto the base control-plane service (#42 KC3). CT_OIDC_ISSUER
  # alone enables OIDC — the control-plane fetches the realm JWKS at startup (KC2-c).
  # Wait for Keycloak so the boot-time JWKS fetch lands.
  control-plane:
    environment:
      CT_OIDC_ISSUER: "${KEYCLOAK_PUBLIC_URL:?set KEYCLOAK_PUBLIC_URL=https://<AUTH_PUBLIC_HOST>}/realms/ct-demo"
      CT_OIDC_CLIENT_ID: "ct-portal"
      CT_OIDC_REDIRECT_URI: "${PORTAL_PUBLIC_URL:?set PORTAL_PUBLIC_URL=https://<zone>}/portal/callback"
      # #65: the code→token exchange secret is DERIVED from the same single .env var
      # that pins Keycloak's client secret above — so the two can never drift apart
      # across a Keycloak reimport (which was the 502 root cause). Not a committed
      # secret: it's an env indirection, and the real value lives only in .env.
      CT_OIDC_CLIENT_SECRET: "${KC_PORTAL_CLIENT_SECRET:?set KC_PORTAL_CLIENT_SECRET=<random hex; same value Keycloak imports>}"
      # The email-domain access-list (#43) is optional; set it in .env to restrict
      # who may register: CT_PORTAL_ALLOWED_EMAIL_DOMAINS=becke.biz
      # #527: an email-allow-list match must ALSO carry the IdP's `email_verified`
      # claim. The realm allows open self-registration, so without this an account
      # that merely types an allow-listed address passes the gate. Committed as "1"
      # rather than left to .env so a fresh deployment cannot silently come up
      # without it. Safe since 2026-08-16, when ct-demo got `verifyEmail=true` with
      # a working SMTP sender — before that, requiring it would have locked out
      # every self-registered user (which is why it shipped defaulting to off).
      CT_GATE_REQUIRE_VERIFIED_EMAIL: "1"
    depends_on:
      keycloak:
        condition: service_healthy

volumes:
  # #307: Keycloak's OLD data dir (the H2 DB file this deployment migrated away
  # from) -- kept as a real rollback artifact, not actively read once the
  # Postgres-backed keycloak-postgres volume below is live.
  keycloak_data:
  # #307: Keycloak's real production Postgres data.
  keycloak_postgres_data:
