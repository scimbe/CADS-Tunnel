# Hosted edge Deployment (M21.2b) — the data-plane entry point.
#
# - The edge serves QUIC (UDP) and a TLS-over-TCP fallback on the same port 4433.
# - replicas: 1: each edge mints its own internal CA at startup and writes the
#   CA root to /shared; distributing one edge's root to clients is out of band.
#   Multi-edge (shared CA / cert distribution) is a later concern.
# - #308: /shared is now a ReadWriteOnce PVC (edge-pvc.yaml), not an emptyDir
#   -- same reasoning as the control-plane's own PVC (control-plane-pvc.yaml):
#   the CA root must survive pod restarts/rescheduling or every already-
#   distributed pin breaks on ordinary pod churn. `strategy: Recreate` for the
#   same reason the control plane uses it -- an RWO PVC can't be bound by two
#   pods at once, so the old pod must fully terminate before a replacement
#   binds the claim.
# - #590: probes target /healthz on the metrics port (edge-config.yaml's
#   CT_EDGE_METRICS_LISTEN), same as control-plane-deployment.yaml's own
#   pattern -- the older "no control-plane HTTP surface" reasoning this
#   comment used to give was stale since #377ff. added the edge's own
#   healthz/metrics server (broker_loops_health() catches a hung/crashed
#   relay-loop task a bare TCP-connect on 4433 cannot: the listener stays
#   accepting even if that task is dead).
# - Hardened: non-root, read-only rootfs, all caps dropped. It needs no
#   NET_ADMIN — that was only for netem in the testbed image.
#
# #309: front-door (443/80 published as 8443/8080, see edge-config.yaml),
# admin (9601, cluster-internal only via edge-admin-service.yaml) and
# channel-broker (4435/4436) ports/env, plus the CT_EDGE_ADMIN_TOKEN Secret
# and the Portal TLS cert volume the front door needs. See edge-config.yaml's
# header for the full Option-A architecture reasoning and what was
# deliberately left out of scope (Keycloak Auth route, Gelb wildcard cert).
#
# CT_EDGE_ADMIN_TOKEN must exist as a Secret named ct-edge-admin-token (key
# `token`) BEFORE `kubectl apply -k` — like control-plane-ingress.yaml's TLS
# secretName, it is supplied out-of-band and never committed:
#
#   kubectl -n ct-system create secret generic ct-edge-admin-token \
#     --from-literal=token="$(openssl rand -hex 32)"
#
# The SAME value must also back control-plane-deployment.yaml's
# CT_CP_EDGE_ADMIN_TOKEN (it reads the same Secret/key) -- edge and control
# plane authenticate to each other with one shared 64-hex token, exactly like
# compose.frontdoor.yml's CT_EDGE_ADMIN_TOKEN / CT_CP_EDGE_ADMIN_TOKEN pair.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ct-edge
  namespace: ct-system
  labels:
    app.kubernetes.io/name: ct-edge
    app.kubernetes.io/part-of: CADS-Tunnel
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ct-edge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ct-edge
        app.kubernetes.io/part-of: CADS-Tunnel
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
        - name: edge
          image: ct-testbed
          command: ["ct-edge"]
          envFrom:
            - configMapRef:
                name: ct-edge-config
          env:
            # #309: the shared edge<->control-plane admin token (tunnel
            # revoke, host-ownership authorize, channel-broker authorize).
            # Secret is NOT part of this kustomize base -- see the header
            # comment above for how to create it out-of-band.
            - name: CT_EDGE_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ct-edge-admin-token
                  key: token
          ports:
            - name: quic
              containerPort: 4433
              protocol: UDP
            - name: tls-tcp
              containerPort: 4433
              protocol: TCP
            # #309: unified :443/:80 front door -- see edge-config.yaml's
            # CT_FRONT_DOOR/CT_EDGE_HTTP_REDIRECT for why these bind 8443/8080
            # instead of 443/80 directly (non-root, no CAP_NET_BIND_SERVICE).
            - name: front-door
              containerPort: 8443
              protocol: TCP
            - name: http-redirect
              containerPort: 8080
              protocol: TCP
            # #309: Agent-Fabric channel broker (rendezvous + relay).
            - name: chan-rndzv-udp
              containerPort: 4435
              protocol: UDP
            - name: chan-rndzv-tcp
              containerPort: 4435
              protocol: TCP
            - name: chan-relay-udp
              containerPort: 4436
              protocol: UDP
            - name: chan-relay-tcp
              containerPort: 4436
              protocol: TCP
            # #309: admin API -- cluster-internal only (edge-admin-
            # service.yaml is a ClusterIP Service, not on the public
            # LoadBalancer in edge-service.yaml).
            - name: admin
              containerPort: 9601
              protocol: TCP
            # #590: healthz/metrics HTTP server (#377ff.) -- see edge-config.yaml's
            # CT_EDGE_METRICS_LISTEN.
            - name: metrics
              containerPort: 9600
              protocol: TCP
          # #375: livenessProbe/readinessProbe alone gave a slow first start (each
          # edge mints its own internal CA and runs PoW setup *before* binding the
          # tls-tcp listener) only ~35-50s before liveness's own failureThreshold
          # kills the pod -- a cold start on a loaded node, a large PoW difficulty,
          # or slow PVC I/O could all genuinely exceed that, causing a real
          # CrashLoopBackOff with the dataplane never coming up. A startupProbe
          # disables liveness/readiness until it succeeds once, so a legitimately
          # slow first start is tolerated without weakening the tight
          # already-running liveness bound below. ~150s window
          # (5s * 30 == 150s), generous for a one-time cold start.
          startupProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # #380: QUIC handshakes, PoW verification (CT_EDGE_POW_DIFFICULTY), TLS
          # termination, and channel-relay are all real CPU/memory work under load --
          # 50m/64Mi requests against a 1 CPU/256Mi limit gave this pod Burstable QoS
          # (early eviction under node memory pressure) plus real CFS-throttling and
          # OOMKill risk once several relay streams are active at once. Aligned to
          # the SAME edge binary's already-tuned, real production values from
          # compose.selfhost.yml (mem_reservation/mem_limit/cpus, #312 -- "the one
          # most likely to actually spike... needs its own headroom") rather than
          # guessing new numbers: 128Mi/512Mi memory, up to 1.5 CPUs.
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              cpu: "1.5"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: shared
              mountPath: /shared
            # #309: the Portal hostname's TLS cert+key the front door
            # terminates with (CT_EDGE_PORTAL_CERT/_KEY, edge-config.yaml).
            # Read-only, matching compose.frontdoor.yml's BYO-cert-dir mount.
            - name: portal-tls
              mountPath: /certs/portal
              readOnly: true
      volumes:
        # #308: persistent (PVC), not emptyDir -- see the header comment. The
        # edge writes its CA root here; the operator extracts and distributes
        # it to clients once, and it now survives every subsequent restart.
        - name: shared
          persistentVolumeClaim:
            claimName: ct-edge-shared
        # #309: sourced from cert-manager (edge-certificate.yaml) by default;
        # see edge-config.yaml's CT_EDGE_PORTAL_CERT comment for the out-of-
        # band alternative if you don't run cert-manager. Either way this
        # Secret (ct-edge-portal-tls) must exist before the pod starts, or the
        # mount fails and the pod stays Pending -- same fail-closed shape as
        # every other required-secret reference in this Deployment.
        - name: portal-tls
          secret:
            secretName: ct-edge-portal-tls
