# Hosted control-plane Deployment (M21.2a).
#
# - replicas: 1 + Recreate: SQLite on a ReadWriteOnce PVC is a single writer, so
#   never run two pods against the same volume; Recreate tears the old pod down
#   before the new one binds the claim.
# - livenessProbe  -> /healthz (always 200 while the process is up).
# - readinessProbe -> /readyz  (pings the DB; pod leaves the Service on 503, so
#   traffic only arrives once the durable store is reachable).
# - runs non-root with a read-only root FS; only /data (the PVC) is writable.
#
# #309: CT_CP_EDGE_ADMIN_TOKEN below must be the SAME Secret/key edge-
# deployment.yaml's CT_EDGE_ADMIN_TOKEN reads (ct-edge-admin-token / token) --
# see that file's header for how to create it out-of-band before `kubectl
# apply -k`. This is the shared credential that authenticates the control
# plane to the edge's admin API (CT_CP_EDGE_ADMIN_URL, control-plane-
# config.yaml) for host-ownership authorize/revoke and tunnel revoke pushes,
# and also gates this control plane's own machine-writer endpoints
# (/enroll/issue, /registry/*, etc., #87/#90/#161) -- unset leaves those
# routes open (dev/back-compat), same as compose's CT_CP_EDGE_ADMIN_TOKEN.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ct-control-plane
  namespace: ct-system
  labels:
    app.kubernetes.io/name: ct-control-plane
    app.kubernetes.io/part-of: CADS-Tunnel
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ct-control-plane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ct-control-plane
        app.kubernetes.io/part-of: CADS-Tunnel
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
        - name: control-plane
          image: ct-testbed
          command: ["ct-control-plane"]
          envFrom:
            - configMapRef:
                name: ct-control-plane-config
          env:
            # #309: see the header comment above -- same Secret/key as the
            # edge's CT_EDGE_ADMIN_TOKEN.
            - name: CT_CP_EDGE_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ct-edge-admin-token
                  key: token
          ports:
            - name: http
              containerPort: 8090
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ct-control-plane-data
