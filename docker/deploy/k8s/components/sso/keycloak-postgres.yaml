# Keycloak's production database (#307: Postgres, not the embedded H2).
# Single replica on its own PVC; only Keycloak may connect
# (keycloak-networkpolicy.yaml).
apiVersion: v1
kind: Service
metadata:
  name: ct-keycloak-postgres
  namespace: ct-system
  labels:
    app.kubernetes.io/name: ct-keycloak-postgres
    app.kubernetes.io/part-of: CADS-Tunnel
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: ct-keycloak-postgres
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ct-keycloak-postgres
  namespace: ct-system
  labels:
    app.kubernetes.io/name: ct-keycloak-postgres
    app.kubernetes.io/part-of: CADS-Tunnel
spec:
  serviceName: ct-keycloak-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ct-keycloak-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ct-keycloak-postgres
        app.kubernetes.io/part-of: CADS-Tunnel
    spec:
      securityContext:
        runAsNonRoot: true
        # uid/gid of the `postgres` user in the alpine image.
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_DB
              value: keycloak
            - name: POSTGRES_USER
              value: keycloak
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ct-keycloak
                  key: db-password
            # A subdirectory: a fresh volume's root may hold lost+found, which
            # initdb refuses.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "keycloak", "-d", "keycloak"]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "keycloak", "-d", "keycloak"]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          # compose.sso.yml: mem_limit 512m, cpus 0.5.
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
      volumes:
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: ct-keycloak-postgres
          app.kubernetes.io/part-of: CADS-Tunnel
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
