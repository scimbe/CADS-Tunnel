# Non-secret Keycloak settings; secrets come from the Secrets listed in
# kustomization.yaml. Mirrors compose.sso.yml's keycloak environment.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ct-keycloak-config
  namespace: ct-system
  labels:
    app.kubernetes.io/name: ct-keycloak
    app.kubernetes.io/part-of: CADS-Tunnel
data:
  # Public issuer base; the token `iss` is <KC_HOSTNAME>/realms/ct-demo and must
  # equal the control plane's CT_OIDC_ISSUER. REPLACE before deploying.
  KC_HOSTNAME: "https://auth.ct-portal.example.com"
  # Substituted into the ct-portal client's redirect URIs (#310). REPLACE.
  PORTAL_PUBLIC_URL: "https://ct-portal.example.com"
  # The edge front door terminates TLS and forwards plain HTTP (L4 proxy, no
  # X-Forwarded-*), same as compose.
  KC_HTTP_ENABLED: "true"
  KC_HOSTNAME_STRICT: "false"
  KC_HEALTH_ENABLED: "true"
  KC_DB: "postgres"
  KC_DB_URL_HOST: "ct-keycloak-postgres"
  KC_DB_URL_DATABASE: "keycloak"
  KC_DB_USERNAME: "keycloak"
  KC_BOOTSTRAP_ADMIN_USERNAME: "admin"
