# Org B: eigenstaendige CADS-Tunnel-Organisation im HAW-ICC-Namespace `cads`,
# Host core.cads.inf.haw-hamburg.de. Org A (bunsenbrenner.org, docker compose)
# bleibt unberuehrt. Rendern: kubectl kustomize docker/deploy/k8s-icc
#
# Vorab von Hand anzulegen (nie committen), nur Namen:
#   ct-edge-admin-token   (Key `token`, 64-hex, geteilt Edge <-> Control-Plane)
#   ghcr-read             (docker-registry-Secret fuer das private ghcr.io-Paket)
# Das Portal-Zertifikat (ct-edge-portal-tls) legt cert-manager per Ingress-Annotation
# (ingress-shim, ClusterIssuer letsencrypt-production, HTTP-01) an, siehe ingress.yaml.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cads
resources:
  - trim
  - edge-service.yaml
  - ingress.yaml
  - networkpolicy.yaml
# Ein Image fuer Edge und Control-Plane, Build: .github/workflows/images.yml
# (Stage `production`); die Basis waehlt die Rolle per `command`.
# Betrieb: einen festen Stand setzen, z. B.
#   kustomize edit set image ct-testbed=ghcr.io/scimbe/cads-tunnel/ct:sha-<kurz>
# Die Vorgabe `main` ist veraenderlich; deshalb zieht der Pod sie bei jedem Start neu
# (imagePullPolicy Always, Patch unten), sonst bliebe ein rollout restart beim alten Image.
#
# Nicht Teil dieses Overlays: das Relay-Gate (ohne CT_EDGE_RELAY_UPSTREAM aus) und UDP.
# Hinter ssl-passthrough sieht die Edge als Quell-IP den Ingress-Controller, nicht den
# Agenten; IP-gebundene Regeln (Agent-Key-Policy, Audit, Verbindungsgrenzen) greifen
# daher nur je Controller-Adresse.
images:
  - name: ct-testbed
    newName: ghcr.io/scimbe/cads-tunnel/ct
    newTag: main
patches:
  - target: {kind: Deployment, name: ct-edge}
    patch: &immer-ziehen |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
  - target: {kind: Deployment, name: ct-control-plane}
    patch: *immer-ziehen
