parent=ct-bunsenbrenner
locales=en,de

# RIISC look (riisc.bunsenbrenner.org, the IT-Security lab access page) for the sign-in pages.
# Same construction as ct-mydailyidea: CSS only, on top of ct-bunsenbrenner (which is on top of
# the stock `keycloak` login theme). No template is overridden; DOM, ids and the social login
# buttons are exactly what Keycloak renders. styles= replaces the parent's list, so the base
# sheets are listed again; ct-site.css and ct-daily.css (the parent's bunsenbrenner.org look and
# its cookie-driven daily look) are deliberately left out -- this theme has one fixed look.
# Messages are merged with the parent's (termsText, errorSignOut* stay).
# Selected per client with the client attribute login_theme=ct-riisc (client praktikum-creator),
# see docs/deploy/keycloak-sso.md.
# Versioned file names (.v2): Keycloak serves theme files for 30 days (max-age=2592000) under a
# URL that only changes with this list, and keeps a gzip copy per path that it never refreshes
# (docs/deploy/keycloak-sso.md). A changed CSS file therefore gets a NEW name here (v3, v4 ...);
# changing this file needs a Keycloak restart (theme.properties is cached in production mode).
styles=css/login.css css/ct-login.v2.css css/ct-riisc.v2.css
