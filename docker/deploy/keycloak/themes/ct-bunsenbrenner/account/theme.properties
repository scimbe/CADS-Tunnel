parent=keycloak.v3
import=common/keycloak

# CADS-Tunnel/bunsenbrenner.org branding for the (otherwise stock) React Account
# Console. logo/logoUrl are the account-ui bundle's own supported customization
# point (Masthead.tsx reads environment.logo as the brand <img> src, relative to
# this theme's resources/, and environment.logoUrl as its click target) -- this is
# also the fix for "missing a back to bunsenbrenner account link": clicking the
# brand mark in the top-left now returns to the portal's own account page.
properties.title=bunsenbrenner.org account
properties.logo=logo.svg
properties.logoUrl=https://bunsenbrenner.org/portal/account

# Recolor the stock PatternFly light theme to bunsenbrenner.org's existing dark
# palette (same tokens the portal's own pages use) and flip PatternFly's own
# built-in dark-theme token set on (pf-v5-t-dark, applied by ct-dark.js before
# first paint) rather than hand-overriding every component's colors individually.
scripts=js/ct-dark.js
styles=css/ct-account.css
