termsText=<p><strong>Nutzungsbedingungen und Datenschutzhinweis — Bunsenbrenner.org</strong></p><p>Mit Klick auf <strong>Accept</strong> schlie&szlig;en Sie einen verbindlichen Vertrag &uuml;ber die <a href="https://bunsenbrenner.org/nutzungsbedingungen" target="_blank" rel="noopener">Nutzungsbedingungen</a> und best&auml;tigen, die <a href="https://bunsenbrenner.org/datenschutz" target="_blank" rel="noopener">Datenschutzerkl&auml;rung</a> von bunsenbrenner.org zur Kenntnis genommen zu haben, einem Dienst des Betreibers Martin Becke (vollst&auml;ndige Kontakt- und Rechtsangaben im <a href="https://bunsenbrenner.org/impressum" target="_blank" rel="noopener">Impressum</a>).</p><p>Kurz zusammengefasst: bunsenbrenner.org stellt ausschlie&szlig;lich Infrastruktur bereit (einen Zero-Knowledge-Tunnel) und ist an den Diensten, die Sie oder andere Nutzer dar&uuml;ber ver&ouml;ffentlichen, nicht beteiligt und macht sich diese nicht zu eigen. Wer &uuml;ber diese Plattform einen eigenen Dienst ver&ouml;ffentlicht, ist <strong>daf&uuml;r allein verantwortlich</strong> &mdash; einschlie&szlig;lich dessen Rechtm&auml;&szlig;igkeit, etwaiger eigener Pflichtangaben (z.&nbsp;B. ein eigenes Impressum, soweit einschl&auml;gig) und der eindeutigen Kennzeichnung im eigenen Angebot, dass es sich um das eigene Angebot des Nutzers handelt und nicht um ein Angebot des Betreibers (Nutzungsbedingungen &sect;5). Eine Nutzung f&uuml;r rechtswidrige Inhalte oder Zwecke ist untersagt (&sect;7).</p><p>Wenn Sie nicht zustimmen, klicken Sie auf <strong>Decline</strong> &mdash; ein Konto kann dann nicht erstellt bzw. genutzt werden.</p>
