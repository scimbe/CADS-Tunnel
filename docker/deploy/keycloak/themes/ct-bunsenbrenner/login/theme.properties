parent=keycloak
locales=en,de

# bunsenbrenner.org branding on top of the stock login-pf theme (DOM/ids
# unchanged -- #username/#password/#kc-login stay exactly as the base `keycloak`
# theme renders them, so this is CSS-only, zero functional risk). login.css is
# the base theme's own stylesheet; ct-login.css is layered after it. (No login-page
# "back to bunsenbrenner.org" link yet -- the base `keycloak` theme's template.ftl
# has no logo/brand element to hook a link on; would need a template.ftl override,
# more risk than this pass takes on. The account console's own back-link, which is
# what was actually reported missing, is real -- see account/theme.properties.)
# ct-site.css: the look of the live bunsenbrenner.org landing page (grid paper, brand with the
# orange dot, mono labels). Own file so that ct-mydailyidea and ct-riisc (which list their own
# styles=) do not get it, and scoped to html:not([data-look=daily]) so the daily look stays as is.
styles=css/login.css css/ct-login.css css/ct-site.css css/ct-daily.css

# Optional "My Daily Idea" look: js/ct-look.js reads the ct_look cookie that the web
# conference sets on Domain=bunsenbrenner.org (strict `daily.RRGGBB.RRGGBB`) and sets
# html[data-look=daily] plus colour variables; css/ct-daily.css is scoped entirely to that
# attribute. No cookie, or an invalid one -> nothing changes. base/login/template.ftl
# (Keycloak 26.7.3) emits each entry as <script src> in <head>, before the body paints.
scripts=js/ct-look.js
