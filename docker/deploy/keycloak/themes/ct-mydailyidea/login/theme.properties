parent=ct-bunsenbrenner
locales=en,de

# "My Daily Idea" look for the sign-in pages. CSS only, on top of ct-bunsenbrenner (which is on
# top of the stock `keycloak` login theme): no template is overridden, DOM and ids stay exactly
# as Keycloak renders them, social login buttons (GitHub, Google ...) come from the realm as
# before. styles= replaces the parent's list, so the parent's base sheets are listed again;
# ct-daily.css (the cookie-driven look of the parent) is deliberately left out -- this theme
# has one fixed look. Resources not found here (login.css, ct-login.css, fonts/) are served from
# the parent. Messages are merged with the parent's (termsText, errorSignOut* stay).
# Selected per client with the client attribute login_theme=ct-mydailyidea, see
# docs/deploy/keycloak-sso.md.
# Versioned file names (.v2): Keycloak serves theme files for 30 days (max-age=2592000) under a
# URL that only changes with this list, and keeps a gzip copy per path that it never refreshes
# (docs/deploy/keycloak-sso.md). A changed CSS file therefore gets a NEW name here (v3, v4 ...);
# changing this file needs a Keycloak restart (theme.properties is cached in production mode).
styles=css/login.css css/ct-login.v2.css css/ct-mydailyidea.css
