# My Daily Idea look for the ct-portal sign-in (login + register), set per client
# via the ct-portal attribute `login_theme` in ../../ct-demo-realm.json. The realm
# default stays ct-bunsenbrenner for every other client.
#
# Inherits everything from ct-bunsenbrenner (error.ftl, messages, locales), which
# in turn sits on the stock `keycloak` theme -- so the DOM, ids and form posts are
# the stock ones (#username/#password/#kc-login, #kc-register-form). CSS only:
# ct-bunsenbrenner's dark ct-login.css is deliberately NOT listed, ct-daily.css
# replaces it. Fixed colours, no URL parameters (gate/start checks return= strictly).
parent=ct-bunsenbrenner
locales=en,de
styles=css/login.css css/ct-daily.css
