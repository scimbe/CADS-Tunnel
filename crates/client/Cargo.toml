[package]
name = "ct-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true

[dependencies]
ct-common = { path = "../common" }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[dev-dependencies]
ct-edge = { path = "../edge" }
# ct-agent moved to its own repo (scimbe/ct-agent) -- these integration tests
# (bench.rs, rendezvous.rs) still exercise it end-to-end, now via a pinned git dep.
# Pinned by commit (no tagged release exists yet); switch to `tag = "vX.Y.Z"` once
# one does, same rev as crates/agent-tools's ct-agent dependency.
ct-agent = { git = "https://github.com/scimbe/ct-agent", rev = "86ab198ffc70d6dcb9ee1bb55efa2191dbd8d408" }
ct-control-plane = { path = "../control-plane" }
axum = "0.7"
