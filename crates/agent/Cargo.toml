[package]
name = "ct-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true

[dependencies]
ct-common = { path = "../common" }
ct-control-plane = { path = "../control-plane" }
# ACME (ADR-0003): Dns01Provider (SelfHosted ct-dns / deSEC) publishes the
# _acme-challenge TXT record the DNS-01 validation reads.
ct-dns = { path = "../dns" }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "time"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
rcgen = "0.13"
axum = "0.7"
tokio-stream = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
# ACME (ADR-0003): JWS signing (ES256, RFC 7515) for the account-key-signed protocol
# requests — a direct dependency (not just transitive via rustls's "ring" feature) so
# ct-agent can drive ring::signature::EcdsaKeyPair itself.
ring = "0.17"
# ACME (ADR-0003): the network driver's HTTP client — rustls-tls to match the rest of
# the workspace's zero-OpenSSL policy (control-plane/edge/dns already do this).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# ACME (ADR-0003, #229): query the zone's AUTHORITATIVE nameservers directly when
# confirming a DNS-01 record has propagated. Public resolvers are the wrong thing to
# ask -- Let's Encrypt validates against the authoritative servers themselves from
# several perspectives, and this zone's two authoritative servers were measured
# drifting ~60s apart, which no resolver-side check can see. Already in the lock file
# transitively (via libp2p); this makes it a direct, intentional dependency.
hickory-resolver = { version = "0.25", default-features = false, features = ["tokio", "system-config"] }
libp2p = { workspace = true }
libp2p-stream = { workspace = true }
tokio-util = { workspace = true }
# #183: process-group kill on service-handler timeout — a negative pid to kill(2) signals the whole
# group, so a grandchild LLM CLI can't survive as an orphan. Done via libc (there is no dependable
# `kill` binary in minimal images; the old `Command::new("kill")` silently no-op'd there).
libc = "0.2"

[features]
# #136 N-rig-2b: build the TEST-ONLY natlab harness binary (the Docker 2-NAT DCUtR punch
# lab). Off by default — the harness runs an UNGUARDED relay (invariant #3's membership gate
# is not wired), so it must never be part of a production build. Enable only in the lab:
# `cargo build -p ct-agent --features nat-lab`.
nat-lab = []

[[bin]]
name = "natlab"
path = "src/bin/natlab.rs"
required-features = ["nat-lab"]

# #171/#173 c3: the flappy-demo crew HTTP bridge (POST /crew/build → safety→physics→art crew,
# assembled via ct_common::crew). Deployed beside the demo's Caddy origin; see examples/flappy-demo.
[[bin]]
name = "ct-crew-bridge"
path = "src/bin/crew_bridge.rs"

# #201: the cookbook-demo crew HTTP bridge (POST /cookbook/build → safety→structure→presentation,
# assembled via ct_common::cookbook). Shares run_cmd/streaming with ct-crew-bridge via ct_agent::bridge.
[[bin]]
name = "ct-cookbook-bridge"
path = "src/bin/cookbook_bridge.rs"

[dev-dependencies]
# test-util enables `#[tokio::test(start_paused = true)]` for deterministic timeout tests (#126).
tokio = { version = "1", features = ["test-util"] }
ct-edge = { path = "../edge" }
ct-client = { path = "../client" }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
