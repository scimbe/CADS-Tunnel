[package]
name = "ct-edge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true

[dependencies]
ct-common = { path = "../common" }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
time = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "net", "sync", "time", "signal"] }
# TCP keepalive (#229) -- see ct-agent's Cargo.toml (github.com/scimbe/ct-agent)
# for the matching comment; applied on the Edge's side of the TLS-TCP fallback too,
# for the same reason. `features = ["all"]` is required for `TcpKeepalive::with_retries`
# (ct-agent#15 flap investigation: bounds the keepalive-probe retry count explicitly
# instead of relying on the OS default) -- without it the method doesn't exist on this
# platform/feature combination.
socket2 = { version = "0.5", features = ["all"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.13", features = ["zeroize"] }
zeroize = "1"
# PEM cert/key parsing via the maintained rustls-pki-types (replaces the
# unmaintained rustls-pemfile, RUSTSEC-2025-0134 / #80 SEC80b). Already in the tree
# via rustls; the `pem` feature enables the PemObject decoders used in transport.rs.
rustls-pki-types = { version = "1", features = ["std", "alloc"] }
rand = "0.8"
axum = { version = "0.7", features = ["ws"] }
# Bridges axum's WebSocket (a Stream+Sink of framed Messages) into a plain
# AsyncRead+AsyncWrite byte stream for the browser channel-join listener
# (ws_channel.rs), so it can feed the same channel_broker core every other
# transport uses.
futures-util = "0.3"
# ws_channel.rs's native-TLS-termination option (CT_EDGE_WS_CHANNEL_CERT/_KEY):
# axum 0.7's `axum::serve` only accepts a concrete `tokio::net::TcpListener` (the
# generic `Listener` trait allowing a per-connection TLS wrap arrived in axum 0.8,
# which this workspace doesn't use -- its route-param syntax change is a much
# larger, unrelated migration). Both are already resolved transitively via axum
# itself; this just names them directly for the low-level connection API axum's
# own examples use for exactly this case.
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["http1", "server", "tokio", "service"] }
# #81 SEC81c-c c-ii: the edge queries the control plane's channel-authorize endpoint.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
# #601: the connection-source audit log (audit_log.rs) -- crates/edge's first disk
# persistence. Same version/features as control-plane's own rusqlite pin
# (crates/control-plane/Cargo.toml) for consistency, even though the two crates share
# no DB file (separate processes, each opens its own).
rusqlite = { version = "0.31", features = ["bundled"] }

[dev-dependencies]
# `test-util` (dev-only) enables tokio's paused clock for the #111 Slowloris timeout test
# (`#[tokio::test(start_paused = true)]`); it stays out of the production build.
tokio = { version = "1", features = ["test-util"] }
ct-control-plane = { path = "../control-plane" }
tower = { version = "0.5", features = ["util"] }
# #425: real DER parsing to verify issued certs' actual not_before/not_after fields
# against parsed output, not just that the code compiles. Already in the workspace's
# transitive dependency tree (rcgen/quinn), pinned here as a direct test-only dep.
x509-parser = "0.17"
http-body-util = "0.1"
ed25519-dalek = "2"
serde_json = "1"
# ws_channel.rs's end-to-end test: real WebSocket clients (not the axum handler side --
# tokio-tungstenite's own client, driving a real TCP connection against a real bound
# listener) proving two browser-shaped members actually admit, pair, and relay through
# the new listener, not just that the server-side plumbing compiles.
tokio-tungstenite = "0.24"
