[package]
name = "ct-common"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = "2"
snow = "0.9"
sha2 = "0.10"
zeroize = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["io-util", "sync", "macros"] }

[dev-dependencies]
# `test-util` enables tokio's paused clock for the #269 idle-timeout tests
# (`#[tokio::test(start_paused = true)]`), same purpose as ct-edge's #111 Slowloris
# timeout test; dev-only, stays out of the production build.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "sync", "time", "test-util"] }
