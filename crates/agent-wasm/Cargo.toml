[package]
name = "ct-agent-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
description = "ct-common's identity/Noise-handshake/channel-framing core, compiled for wasm32-unknown-unknown and exposed to JavaScript via wasm-bindgen -- the browser side of an Agent-Fabric channel member. Not a port of ct-agent itself (which depends on quinn/raw UDP/socket2, none of which exist in a browser); the actual byte transport to the edge is a separate concern (a WebSocket bridge), this crate only ever produces/consumes the same wire bytes a native member does."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ct-common = { path = "../common" }
wasm-bindgen = "0.2"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
console_error_panic_hook = "0.1"
