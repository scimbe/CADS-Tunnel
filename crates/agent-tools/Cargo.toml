[package]
name = "ct-agent-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true

# Test/diagnostic tools (natlab, metrics_probe, udp_echo) that stayed in CADS-Tunnel
# when ct-agent itself was extracted to its own repo (scimbe/ct-agent). Only `natlab`
# actually depends on ct-agent (its nat_lab_* test harness functions); the rest depend
# on nothing from ct-agent at all -- both are standalone.
#
# The demo-specific crew/cookbook bridge *binaries* (ct-crew-bridge, ct-cookbook-bridge,
# #219) were removed in #232: both demos migrated to their own thin Node.js bridges
# weeks before core's side of that cleanup landed (see
# docs/onboarding/pipeline-bridge-pattern.md for the pattern that replaces them for any
# future pipeline). `ct_common::crew` itself stays -- #232's own hermetic gate caught
# that `scimbe/ct-agent`'s `channel_run.rs` (`crew_build_over`) still depends on it
# directly as a library primitive, so removing the module would have broken that
# separate repo's build. `ct_common::cookbook` had no such consumer (#455's own
# thirteen-repo caller survey found none anywhere, including ct-agent) and was removed
# outright.

[dependencies]
ct-common = { path = "../common" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "time", "sync"] }

[features]
# See ct-agent's own `nat-lab` feature doc comment -- required to build `natlab`.
nat-lab = ["ct-agent/nat-lab"]

# Version: root Cargo.toml [workspace.dependencies] (single source). natlab's
# nat_lab_relay/listen/dial live here and nowhere else.
[dependencies.ct-agent]
workspace = true
optional = true

# #782: the `verify_receipts` bin's tests verify the fixture chain ct-common's own
# tests are built on (`ct_common::receipt::test_support`); same feature-on-dev-dependency
# pattern as ct-edge's, never enabled by a non-test build.
[dev-dependencies]
ct-common = { path = "../common", features = ["test-support"] }

[[bin]]
name = "metrics_probe"
path = "src/bin/metrics_probe.rs"

[[bin]]
name = "udp_echo"
path = "src/bin/udp_echo.rs"

[[bin]]
name = "natlab"
path = "src/bin/natlab.rs"
required-features = ["nat-lab"]

# #782: offline verifier for a tunnel's signed forensic receipts export.
[[bin]]
name = "verify_receipts"
path = "src/bin/verify_receipts.rs"
