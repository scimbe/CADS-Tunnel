[package]
name = "ct-control-plane"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true

[features]
# #438: `http` (M13.1's in-memory, unauthenticated router) is real test scaffolding
# that reads like a shipping API -- gated so a real build never has it reachable at
# all. This crate's own tests get it via plain `cfg(test)`; a dependent crate's tests
# (ct-client's rendezvous.rs) enable this feature on its dev-dependency instead.
test-support = []

[dependencies]
ct-common = { path = "../common" }
ct-dns = { path = "../dns" }
rand = "0.8"
ed25519-dalek = { version = "2", features = ["rand_core"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.31", features = ["bundled"] }
# #344: SqliteTunnelStore's read-only methods use a real connection pool instead
# of the app-level Mutex<Connection> every other Sqlite* store still uses (see
# storage.rs's module + struct docs for the full read/write-contention
# reasoning). r2d2_sqlite is pinned to the exact 0.24 series because that is the
# last version whose own Cargo.toml requires `rusqlite = "^0.31"` -- 0.25+ bumps
# to rusqlite 0.32, which would conflict with this workspace's pinned 0.31.
r2d2 = "0.8"
r2d2_sqlite = "0.24"
jsonwebtoken = "9"
hmac = "0.12"
sha2 = "0.10"
# ADR-0025 (admin console, cert-expiry dashboard, `cert_status.rs`): real PEM/
# X.509 parsing of the front-door cert files' notAfter. Already resolved in
# this workspace's Cargo.lock via ct-edge's own dev-dependency (`pki.rs`'s
# not_after verification) -- pinned to the identical 0.17 rather than adding a
# second cert-parsing dependency.
x509-parser = "0.17"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "fs", "signal"] }
# #437: join_all for tunnels_page's concurrent edge_tunnel_status calls (was N
# sequential awaited round trips, one per tunnel row).
futures = "0.3"
# Browser-Plane login gate (#382-follow): keycloak_admin.rs's temporary-password
# generation for a freshly provisioned account.
base64 = "0.22"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# Test-only: generate a throwaway RSA key at runtime to prove the JWKS -> verifier
# round-trip (#42 KC2-b) without committing a private key (secret-guard forbids).
rsa = { version = "0.9", features = ["pem"] }
