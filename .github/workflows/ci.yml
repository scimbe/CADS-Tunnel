name: ci

# #78 SEC78b — a read-only server-side gate on `main`, independent of the autonomous
# developer loop. Mirrors the loop's hermetic gate: workspace build + test under
# `-D warnings`, the committed-secret guard, and a dependency audit.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-D warnings"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Build (workspace, -D warnings)
        run: cargo build --workspace --locked

      - name: Test (workspace, -D warnings)
        run: cargo test --workspace --locked

      - name: Committed-secret guard
        run: bash scripts/check-no-secrets.sh

      - name: No new rule without an enforcer
        # #579: four times on 2026-08-18 the same shape turned up -- something built,
        # tested and documented that nothing live calls (#576 the policy consulted in the
        # wrong branch, #578 the authorization gate with no caller, #560 three channel
        # mechanisms never exercised, #225 the auction policy). #248 recorded it in July
        # already. Every one of them was found by hand; this makes the next one fail here
        # instead. Fails only when the set GROWS against scripts/policy-predicates.baseline
        # -- and exits 2 if its own detector stops matching, because an empty result would
        # otherwise read exactly like a clean one.
        run: python3 scripts/policy-predicate-guard.py

      - name: hello-world-pipeline.zip matches its source files
        # The zip is include_bytes!'d into the served /downloads/hello-world-pipeline.zip
        # (crates/control-plane/src/service.rs) but built by hand from README.md/
        # hello-handler.sh/pipeline-spec.json — nothing regenerated it automatically, so it
        # silently went stale (a README fix landed without the zip ever being rebuilt).
        # Rebuild it deterministically here and fail if the committed one differs, so a
        # PR that edits any source file without regenerating the zip is caught in CI
        # instead of shipping a stale download.
        run: |
          cd examples/hello-world-pipeline
          python3 -c "
          import zipfile
          with zipfile.ZipFile('rebuilt.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              for f in ['README.md', 'hello-handler.sh', 'pipeline-spec.json']:
                  z.write(f, f)
          "
          python3 -c "
          import zipfile, sys
          def names(p):
              with zipfile.ZipFile(p) as z:
                  return {n: z.read(n) for n in z.namelist()}
          a, b = names('hello-world-pipeline.zip'), names('rebuilt.zip')
          if a != b:
              print('hello-world-pipeline.zip is stale relative to its source files.')
              print('Rebuild it (see examples/hello-world-pipeline, or the same 3-line')
              print('zipfile.ZipFile(...) snippet this check uses) and commit the result.')
              sys.exit(1)
          "
          rm -f rebuilt.zip

      - name: Dependency audit
        run: |
          cargo install cargo-audit --locked || true
          cargo audit

  # ct-common is deliberately wasm32-portable: it is compiled for the browser
  # channel-claim page (ct-agent-wasm) and the WASM video-conferencing spike. Until now
  # nothing in THIS repo's CI ever built it for wasm32 -- the native `gate` job above
  # only sees the host target -- so a dependency added outside the
  # `[target.'cfg(not(target_arch = "wasm32"))']` block, or a `cfg` typo on a
  # native-only module (channel_dial.rs), would only surface downstream, at ct-agent's
  # next pin bump, days later and in the wrong repo. Phase 2 of the channel-protocol
  # consolidation moves more native-only code into ct-common, so this gate has to exist
  # BEFORE that lands. Same `-D warnings`/`--locked` posture as the native gate.
  wasm32:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-D warnings"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown
      - name: Build ct-common for wasm32-unknown-unknown (-D warnings)
        run: cargo build -p ct-common --target wasm32-unknown-unknown --locked

  # Der Realm-Import laeuft bei JEDEM Keycloak-Start; eine schema-ungueltige Datei
  # verhindert ihn (2026-08-16: hinzugefuegte `_comment`-Felder nahmen die
  # Auth-Ebene fuer ~6 Minuten offline). Syntaxpruefung reicht nicht -- die Datei
  # WAR gueltiges JSON. Nur Keycloak kennt das Schema, also fragt dieser Job
  # Keycloak. Laeuft nur, wenn die Datei oder ihr Pruefer sich geaendert hat;
  # braucht kein Geheimnis und keine laufende Umgebung.
  realm-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Der Standard ist ein flacher Klon (Tiefe 1) -- darin existiert die
          # Vergleichsbasis nicht, `git diff` scheitert, und die Erkennung
          # unten hielt das faelschlich fuer "nichts geaendert". Genau daran
          # ist dieser Job zweimal vorbeigelaufen, ohne je zu pruefen.
          fetch-depth: 0
      - name: Nur bei Aenderung an Realm-Datei oder Pruefer
        id: changed
        run: |
          set -u
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          pattern='docker/deploy/keycloak/.*\.json|scripts/validate-realm-import\.sh'
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "unbestimmbare Basis -> pruefen"; echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Kann der Vergleich nicht ausgefuehrt werden, wird GEPRUEFT statt
          # uebersprungen: eine Bedingung, die sich nicht beantworten laesst,
          # darf einen Guard nicht stillschweigend abschalten.
          if ! files=$(git diff --name-only "$base" "${{ github.sha }}" 2>&1); then
            echo "git diff fehlgeschlagen ($files) -> pruefen"; echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if printf '%s\n' "$files" | grep -qE "$pattern"; then
            echo "relevante Aenderung -> pruefen"; echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "keine relevante Aenderung -> ueberspringen"; echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      # Ein uebersprungener Schritt meldet einen gruenen Job -- von einer
      # bestandenen Pruefung ist das nicht zu unterscheiden. (Genau darauf bin
      # ich am 16.08. selbst hereingefallen und habe "Job gruen" als "Guard
      # laeuft" gelesen.) Beide Faelle schreiben deshalb in die Run-Summary,
      # sodass die Uebersicht sagt, ob geprueft wurde oder nicht.
      - name: Ergebnis in der Zusammenfassung vermerken
        run: |
          if [ "${{ steps.changed.outputs.run }}" = "true" ]; then
            echo "Realm-Import: **wird validiert** (Realm-Datei oder Pruefer geaendert)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Realm-Import: **nicht geprueft** -- keine Aenderung an \`docker/deploy/keycloak/*.json\` oder \`scripts/validate-realm-import.sh\`. Das ist kein Freispruch, nur eine ausgelassene Pruefung." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Realm-Importdatei validieren
        if: steps.changed.outputs.run == 'true'
        run: ./scripts/validate-realm-import.sh
