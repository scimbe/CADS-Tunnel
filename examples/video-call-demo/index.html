<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>CADS-Tunnel video-call demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; color: #1a1a1a; }
  h1 { font-size: 1.1rem; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: .25rem 1rem; }
  dt { font-weight: 600; }
  #log { font-family: ui-monospace, monospace; font-size: .8rem; white-space: pre-wrap; background: #f4f4f4; padding: .5rem; border-radius: 4px; max-height: 12rem; overflow-y: auto; }
</style>
</head>
<body>
<h1>CADS-Tunnel video-call demo</h1>
<p>Real ct-agent-wasm channel-join + Noise_IK handshake + encrypted WebRTC signaling, driving a real
<code>RTCPeerConnection</code>. Configured entirely via URL query params (<code>ws</code>, <code>grant</code>,
<code>holderPriv</code>, <code>noisePriv</code>, <code>role</code>) -- see app.js's header comment.</p>
<dl>
  <dt>status</dt><dd id="status">idle</dd>
  <dt>ICE state</dt><dd id="ice-state">new</dd>
</dl>
<div id="log"></div>
<script type="module" src="./app.js"></script>
</body>
</html>
