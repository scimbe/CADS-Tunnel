# Demo: serve https://help.bunsenbrenner.org through the Browser Plane, with a
# real Let's Encrypt certificate obtained at the origin via deSEC DNS-01.
#
# Runs ALONGSIDE an already-running plane (ct-edge with CT_EDGE_BROWSER_LISTEN=:443
# and a ct-control-plane the agent onboards against). Adapt the network/names to
# your plane's compose. Env comes from docker/deploy/.env (see docs/dns01-desec.md).
#
#   docker compose -f examples/help-site/compose.help-site.yml \
#     --env-file docker/deploy/.env up --build -d
services:
  help-origin:
    # Plain Caddy: terminates TLS with a cert issued CORE-side (#219,
    # scripts/lib-acme.sh) and mounted read-only below — no ACME client or
    # deSEC token in this container at all.
    build:
      context: .
      dockerfile: Caddy.Dockerfile
    volumes:
      - ./index.html:/srv/index.html:ro
      # #226: this agent's own signed AgentCard, so it can be a real (not fabricated)
      # entry in /registry/agents — proof the auto-discoverability path works end to
      # end, using core's own infrastructure/keys, not anyone else's.
      - ./.well-known:/srv/.well-known:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # #219: fullchain.pem + privkey.pem, issued CORE-side (see
      # docs/dns01-desec.md) — never a DESEC_TOKEN, never an ACME client here.
      - ${HELP_CERT_DIR:?set HELP_CERT_DIR=<dir with fullchain.pem+privkey.pem>}:/certs:ro
      - help_caddy_data:/data
    expose:
      - "443"   # reachable only via the tunnel/agent, not published to the host
    # #36: keep the origin up across host reboots / #15 stack redeploys, so the
    # "route intact but Caddy origin stuck/down" failure mode recovers on its own.
    restart: unless-stopped

  help-agent:
    # ct-agent, in Browser-Plane mode -- built from the standalone scimbe/ct-agent
    # repo (see Agent.Dockerfile), not from CADS-Tunnel workspace source.
    build:
      context: .
      dockerfile: Agent.Dockerfile
      args:
        # #512: the fallback MUST match the repo-root CT_AGENT_RELEASE file (test-pinned).
        - CT_AGENT_REF=${CT_AGENT_REF:-v0.5.7}
    environment:
      - CT_AGENT_MODE=browser                       # SNI passthrough to the origin
      - CT_AGENT_FRAMED_FALLBACK=1                  # #528: framed TLS-TCP fallback (in-flight keepalive)
      - CT_AGENT_HOSTNAME=help.bunsenbrenner.org     # bound at the edge via 'H'
      # #23 BP4b: when set (by run-demo.sh after authorizing the hostname), the
      # agent registers under this routing token so the bind is authorized. Empty
      # -> the agent mints its own token (BP4a-only path).
      - CT_AGENT_TOKEN=${HELP_AGENT_TOKEN:-}
      - CT_AGENT_ORIGIN=help-origin:443              # forward raw TLS here (hostname resolved, #45)
      - CT_AGENT_ORIGIN_PROTO=tcp
      # #45: this service has no /shared volume (unlike the main plane), so point
      # the capability file at a writable path — nothing here reads it back.
      - CT_AGENT_CAPABILITY_OUT=/tmp/capability.bin
      - CT_AGENT_EDGE=${HELP_AGENT_EDGE:?edge host:port, e.g. edge:4433}
      - CT_AGENT_CP_URL=${HELP_AGENT_CP_URL:?control-plane URL for onboarding}
      - CT_AGENT_JOIN_TOKEN=${HELP_JOIN_TOKEN:?single-use join token}
      - CT_AGENT_ID=help-demo
      - CT_AGENT_EDGE_CERT_URL=${HELP_AGENT_EDGE_CERT_URL:-}
      # #141: persist the onboarding outcome (bound identity + tenant) on the durable
      # help_agent_state volume so a container restart RESTORES it instead of
      # re-redeeming the single-use join token — the crash-loop that took the demo
      # down. First boot redeems + persists here; every later boot restores and never
      # touches the control plane. Live-restart-verified (RestartCount stays 0).
      - CT_AGENT_STATE_DIR=/var/lib/ct-agent
      # #36: retry forever so a redeployed/bounced edge (the #15 stack churn) is
      # rejoined automatically instead of the agent giving up after 10 tries and
      # exiting — which, holding a single-use join token, can't cleanly re-onboard.
      - CT_AGENT_RECONNECT_MAX_ATTEMPTS=0
    # #45: Agent.Dockerfile has no ENTRYPOINT, so `command` is the full argv — it
    # must name the binary (ct-agent), then the subcommand. `["onboard"]` alone
    # tries to exec a binary literally named "onboard", which doesn't exist.
    command: ["ct-agent", "onboard"]
    depends_on:
      - help-origin
    # #36: backstop for an actual crash/OOM. Safe now that the agent retries the
    # edge forever (it won't exit on edge downtime), so this won't crash-loop
    # redeeming an already-spent join token.
    restart: unless-stopped
    # #141: durable state for restart-safe onboarding (see CT_AGENT_STATE_DIR above).
    volumes:
      - help_agent_state:/var/lib/ct-agent

volumes:
  help_caddy_data:
  help_agent_state:

# #45: join the running self-host plane's network so help-agent/help-origin can
# reach `edge` and `control-plane` (and the HELP_AGENT_EDGE/HELP_AGENT_CP_URL
# hostnames resolve). Without this the compose creates its own isolated network
# and the agent can't reach the plane at all. The base stack (compose.selfhost.yml,
# `name: ct-selfhost`) creates the `ct-selfhost_default` network; bring it up first.
networks:
  default:
    name: ct-selfhost_default
    external: true
