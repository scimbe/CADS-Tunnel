# cargo-audit configuration for the #78 CI dependency-audit gate.
#
# Each ignored advisory below is documented with WHY it is NOT a production exposure for this
# workspace: either the flagged version is not compiled into any release binary (`cargo tree
# -i <crate>@<version> -e normal` finds nothing), or the compiled version is outside the
# advisory's affected range. These are gate-
# hygiene ignores of non-exploitable, resolved-but-inactive dependencies, NOT acceptance of a
# live risk. Flagged to central for security-review sign-off.

[advisories]
ignore = [
    # hickory-proto: two copies are resolved. 0.26.1 IS compiled (ct-dns -> hickory-resolver
    # 0.26.1 -> ct-control-plane, used by dns01_challenge's convergence check) and is NOT
    # affected: 0118 lists >= 0.26.0-beta.1 as unaffected, 0119 is patched in >= 0.26.1.
    # The advisories match only 0.25.2, an inactive optional dep of libp2p's `dns`/`mdns`
    # features, which this workspace does not enable. Re-check if either version changes.
    "RUSTSEC-2026-0118",  # hickory-proto NSEC3 unbounded loop -- compiled 0.26.1 unaffected
    "RUSTSEC-2026-0119",  # hickory-proto O(n^2) name compression -- compiled 0.26.1 patched

    # rsa (Marvin Attack, timing side-channel key recovery — no upstream fix): pulled ONLY by the
    # TEST-side `jsonwebtoken::encode` that mints test JWTs (control-plane tests); it is not in any
    # release binary. Production code only VERIFIES RS256 JWTs via a public-key `DecodingKey`
    # (crates/control-plane/src/portal.rs) — the Marvin attack targets RSA PRIVATE-key operations,
    # which this service never performs in production.
    "RUSTSEC-2023-0071",
]
